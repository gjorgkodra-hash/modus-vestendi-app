<style>
:root{
  /* palette dal logo MV: crema, cuoio, cucitura marrone, inchiostro */
  --bg:#e6dfd5; --surface:#faf7f2; --ink:#2c2527; --muted:#6e605a; --line:#d8ccbf;
  --accent:#4c2f2a; --tan:#deb598; --accent-soft:#f1e1d2; --good:#3f7350; --warn:#a8711f; --bad:#a63d3d;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,"Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
h1,h2,h3{font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:700;margin:0 0 .5em;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:nowrap}
.top-row .row{flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Jost,"Century Gothic",sans-serif;font-size:17px;letter-spacing:.12em;text-transform:lowercase;color:var(--ink)}
.brand img{height:30px;width:auto}
.login-logo{display:block;width:150px;max-width:60%;margin:4px auto 6px}
.tagline{text-align:center;font-family:Jost,sans-serif;letter-spacing:.18em;font-size:14px;color:var(--ink);margin:0 0 18px}
.top-row select{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
nav.tabs{display:flex;gap:4px;padding:8px 0 0}
nav.tabs a{flex:1 1 0;min-width:0;text-align:center;color:var(--muted);text-decoration:none;padding:9px 4px;border-radius:10px 10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
nav.tabs a.on{background:var(--tan);color:var(--ink);font-weight:600}
.menu-btn{border:1px solid var(--line);background:transparent;width:40px;height:40px;padding:0;justify-content:center;flex:none}
.menu-btn span,.menu-btn span::before,.menu-btn span::after{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;position:relative;content:""}
.menu-btn span::before{position:absolute;top:-6px}.menu-btn span::after{position:absolute;top:6px}
.menu-btn.on{background:var(--tan);border-color:var(--accent)}
.drop{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(44,37,39,.12);padding:6px 16px 14px;transform-origin:top;animation:drop .18s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.drop{animation:none}}
.drop a,.drop .drop-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:16px}
.drop a.on{font-weight:600}
.drop a.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.drop .who{padding:10px 4px 4px;color:var(--muted);font-size:13px}
.drop button.link{font-size:16px;padding:13px 4px;color:var(--bad)}
.menu-veil{position:fixed;inset:0;z-index:15;background:rgba(44,37,39,.25)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-size:24px;font-weight:600}
.kpi .l{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
button.accent{background:var(--tan);color:var(--ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:#e9c6c6}
button.link{border:none;background:none;color:var(--accent);padding:4px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:90px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.search{max-width:340px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.card > table{display:block;overflow-x:auto}
.card > table > tbody{display:table;width:100%}
main > .row.spread{margin-bottom:14px}
.card > table.pnl{display:table}
.pnl td:first-child{white-space:normal}
.help{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:14px}
.help b{color:var(--accent)}
.sep{margin:6px 0 12px;font-size:13px;color:var(--muted);text-align:center}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
tr.click{cursor:pointer} tr.click:hover{background:var(--accent-soft)}
.table-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:#e3f1e8;color:var(--good)} .pill.warn{background:#fbf0dc;color:var(--warn)} .pill.bad{background:#f7e1e1;color:var(--bad)} .pill.grey{background:#eee;color:#666}
.models{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.model{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer}
.model .ph{aspect-ratio:3/4;background:var(--accent-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b5a796;font-size:13px}
.model .b{padding:10px}
.model .n{font-weight:600;font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo-add{width:96px;height:128px;border:2px dashed var(--accent);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-size:13px;text-align:center;cursor:pointer;background:var(--accent-soft);padding:6px}
.photo-add .plus{font-size:28px;line-height:1}
.file-box{display:flex;align-items:center;gap:12px;border:2px dashed var(--accent);border-radius:12px;padding:14px;background:var(--accent-soft);color:var(--accent);cursor:pointer;margin:0}
.file-box .plus{font-size:26px;line-height:1}
.file-prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.file-prev img{width:56px;height:74px;object-fit:cover;border-radius:8px}
.photos .p{width:96px;height:128px;border-radius:10px;background:var(--accent-soft) center/cover;position:relative;border:2px solid transparent}
.photos .p.main{border-color:var(--accent)}
.photos .p button{position:absolute;bottom:4px;right:4px;padding:2px 6px;font-size:11px}
.matrix td,.matrix th{text-align:center}
.matrix td.q{font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
.toast.err{background:var(--bad)}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login{max-width:380px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.msg{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;white-space:pre-wrap}
.msg.out{border-color:var(--accent)}
.right{text-align:right}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.hide{display:none!important}
</style>
</head>

function toast(msg, err){ const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), err ? 5000 : 2200); }
function check(res){ if (res.error){ toast(res.error.message, true); throw res.error; } return res.data; }
const S = {user:null, profile:null, brands:[], categories:[], carriers:[], suppliers:[], trips:[]};
const can = {
  catalogWrite: () => ['admin','magazzino'].includes(S.profile?.role),
  costs: () => ['admin','magazzino'].includes(S.profile?.role),
  sales: () => ['admin','vendite'].includes(S.profile?.role),
  admin: () => S.profile?.role === 'admin'
};
function statusPill(group, v){
  const good = ['in_magazzino','consegnato','incassato','consegnato_dal_corriere','ricevuto','trovata','attiva'];
  const warn = ['bozza','da_incassare','da_spedire','in_arrivo','ordinato','riservato','in_dogana','aperta','da_ordinare'];
  const bad = ['annullato','problema','reso','venduto','fermata'];
  const cls = good.includes(v) ? 'good' : warn.includes(v) ? 'warn' : bad.includes(v) ? 'bad' : '';
  return `<span class="pill ${cls}">${esc(ev(group, v))}</span>`;
}

// ====== Modale con form ======
function modal(html){ const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal">${html}</div>`; bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); }); document.body.appendChild(bg); return bg; }
function form({title, fields, values = {}, onSubmit, submitLabel, extra = ''}){
  const html = `<h2>${esc(title)}</h2><form>${fields.map(f => {
    const v = values[f.name] ?? f.value ?? '';
    let input;
    if (f.type === 'select') input = `<select name="${f.name}" ${f.required ? 'required' : ''}>${f.empty !== false ? '<option value="">—</option>' : ''}${f.options.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea name="${f.name}">${esc(v)}</textarea>`;
    else if (f.type === 'sizes') input = sizesEditor(f.name);
    else if (f.type === 'datalist') input = `<input name="${f.name}" list="dl_${f.name}" value="${esc(v)}" autocomplete="off" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''}><datalist id="dl_${f.name}">${f.options.map(o => `<option value="${esc(o)}"></option>`).join('')}</datalist>`;
    else if (f.type === 'heading') { return `<h3 style="margin:18px 0 8px">${esc(f.label)}</h3>${f.hint ? `<p class="small muted" style="margin:-4px 0 10px">${esc(f.hint)}</p>` : ''}`; }
    else if (f.type === 'checkbox') input = `<input type="checkbox" name="${f.name}" style="width:auto" ${v ? 'checked' : ''}>`;
    else if (f.type === 'file') input = `<div class="row" style="flex-wrap:nowrap"><label class="file-box" style="flex:1"><span class="plus" style="display:flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span>${t('take_photo')}</span><input type="file" name="${f.name}_cam" accept="image/*" capture="environment" class="hide" onchange="previewFiles(this)"></label><label class="file-box" style="flex:1"><span class="plus">+</span><span>${t('from_gallery')}</span><input type="file" name="${f.name}" accept="image/*" multiple class="hide" onchange="previewFiles(this)"></label></div><div class="file-prev"></div>`;
    else input = `<input name="${f.name}" type="${f.type || 'text'}" ${f.type === 'number' ? 'step="any"' : ''} value="${esc(v)}" ${f.required ? 'required' : ''}>`;
    return `<div class="field"><label>${esc(f.label)}</label>${input}</div>`;
  }).join('')}${extra}<div class="row" style="justify-content:flex-end;margin-top:8px"><button type="button" data-x>${t('cancel')}</button><button class="primary" type="submit">${esc(submitLabel || t('save'))}</button></div></form>`;
  const m = modal(html);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const out = {};
    fields.forEach(f => {
      if (f.type === 'heading') return;
      if (f.type === 'sizes'){ out[f.name] = [...e.target.querySelectorAll(`[data-sz="${f.name}"] .sz-row`)].map(r => ({size: r.querySelector('.sz-n').value.trim(), qty: Number(r.querySelector('.sz-q').value) || 0})).filter(r => r.size || r.qty); return; }
      const el = e.target.elements[f.name];
      if (f.type === 'checkbox') out[f.name] = el.checked;
      else if (f.type === 'file') out[f.name] = [...e.target.elements[f.name + '_cam'].files, ...el.files];
      else if (f.type === 'number') out[f.name] = num(el.value);
      else out[f.name] = el.value === '' ? null : el.value;
    });
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try { await onSubmit(out, m); m.remove(); } catch (err) { console.error(err); btn.disabled = false; }
  };
  return m;
}
const SIZE_SETS = [['XS','S','M','L','XL'], ['36','38','40','42','44','46'], ['TU']];
function sizesEditor(name){
  const row = (n = '', q = 1) => `<div class="sz-row row" style="flex-wrap:nowrap;margin-bottom:6px"><input class="sz-n" placeholder="${t('size')}" value="${esc(n)}" style="flex:1"><input class="sz-q" type="number" min="0" value="${q}" style="width:90px" aria-label="${t('qty')}"><button type="button" class="link" onclick="this.closest('.sz-row').remove()">✕</button></div>`;
  window._szRow = row;
  return `<div data-sz="${name}"><div class="row small muted" style="flex-wrap:nowrap;margin-bottom:4px"><span style="flex:1">${t('size')}</span><span style="width:110px">${t('qty_pieces')}</span></div>
  <div class="sz-rows">${row('TU', 1)}</div>
  <div class="chips" style="margin-top:6px">${SIZE_SETS.map(set => `<button type="button" class="small" onclick="fillSizes(this, ${esc(JSON.stringify(set))})">${set.join(' ')}</button>`).join('')}<button type="button" class="small" onclick="this.closest('[data-sz]').querySelector('.sz-rows').insertAdjacentHTML('beforeend', window._szRow('', 1))">+ ${t('add_size')}</button></div>
  <p class="small muted" style="margin:6px 0 0">${t('sizes_hint')}</p></div>`;
}
function fillSizes(btn, set){
  const box = btn.closest('[data-sz]').querySelector('.sz-rows');
  box.innerHTML = set.map(sz => window._szRow(sz, set.length === 1 ? 1 : 0)).join('');
}
function confirmBox(msg){ return confirm(msg || t('sure')); }

// ====== Foto ======
async function resizeImage(file, max = 1600){
  const img = await createImageBitmap(file);
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
}
const urlCache = {};
async function signedUrls(paths){
  const need = [...new Set(paths.filter(p => p && !urlCache[p]))];
  if (need.length){
    const { data } = await sb.storage.from('foto').createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d.signedUrl) urlCache[d.path] = d.signedUrl; });
  }
  return urlCache;
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  if (!S.user) return renderLogin();
  const p = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  S.profile = p.data;
  if (S.profile?.lang && !localStorage.getItem('mv_lang')) LANG = S.profile.lang;
  document.documentElement.lang = LANG;
  if (!S.profile?.role) return renderWaiting();
  await loadRefs();
  renderShell();
  route();
}
async function loadRefs(){
  const [b, c, k] = await Promise.all([
    sb.from('brands').select('*').order('name'),
    sb.from('categories').select('*').order('name'),
    sb.from('carriers').select('*').order('name')
  ]);
  S.brands = b.data || []; S.categories = c.data || []; S.carriers = k.data || [];
  if (can.costs()){
    const [s, tr] = await Promise.all([sb.from('suppliers').select('*').order('name'), sb.from('trips').select('*').order('start_date', {ascending:false})]);
    S.suppliers = s.data || []; S.trips = tr.data || [];
  }
}
const catName = c => (LANG === 'en' && c.name_en) || (LANG === 'sq' && c.name_sq) || c.name;
const catLabel = id => { const c = S.categories.find(x => x.id === id); if (!c) return ''; const p = S.categories.find(x => x.id === c.parent_id); return p ? `${catName(p)} › ${catName(c)}` : catName(c); };
const catOptions = () => S.categories.map(c => [c.id, catLabel(c.id)]).sort((a, b) => a[1].localeCompare(b[1]));
const brandName = id => S.brands.find(b => b.id === id)?.name || '';

function langSelect(){ return `<select style="width:auto;padding:4px 8px" onchange="setLang(this.value)">${['it','en','sq'].map(l => `<option value="${l}" ${l === LANG ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('')}</select>`; }
async function setLang(l){ LANG = l; localStorage.setItem('mv_lang', l); if (S.profile) await sb.from('profiles').update({lang: l}).eq('id', S.user.id); location.reload(); }

function renderLogin(mode = 'login'){
  $('#app').innerHTML = `<div class="center"><div class="card login">
    <div class="row" style="justify-content:flex-end">${langSelect()}</div><img class="login-logo" src="icons/mv-mark.png" alt="MV"><h1 style="text-align:center;font-size:24px;letter-spacing:.12em;margin:0">modus vestendi</h1><p class="tagline">your online closet</p>
    <form id="lf">
      ${mode === 'signup' ? `<div class="field"><label>${t('name')}</label><input name="name" required></div>` : ''}
      <div class="field"><label>${t('email')}</label><input name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>${t('password')}</label><input name="password" type="password" minlength="8" required autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}"></div>
      <button class="primary" style="width:100%;justify-content:center">${mode === 'signup' ? t('signup') : t('login')}</button>
    </form>
    <p class="small muted" style="text-align:center;margin-top:14px"><button class="link" id="sw">${mode === 'signup' ? t('login') : t('signup')}</button></p>
  </div></div>`;
  $('#sw').onclick = () => renderLogin(mode === 'signup' ? 'login' : 'signup');
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = e.target.elements;
    if (mode === 'signup'){
      const r = await sb.auth.signUp({email: f.email.value, password: f.password.value, options: {data: {full_name: f.name.value}, emailRedirectTo: location.href.split('#')[0]}});
      if (r.error) return toast(r.error.message, true);
      if (!r.data.session) return toast(t('check_email'));

      const r = await sb.auth.signInWithPassword({email: f.email.value, password: f.password.value});
      if (r.error) return toast(r.error.message, true);

}

  $('#app').innerHTML = `<div class="center"><div class="card login"><img class="login-logo" src="icons/mv-mark.png" alt="MV"><p>${t('waiting_role')}</p><button onclick="logout()">${t('logout')}</button></div></div>`;

// ====== Struttura e navigazione ======
const MAIN_TABS = {admin:['dashboard','catalog','orders','customers'], vendite:['dashboard','catalog','orders','customers'], magazzino:['dashboard','catalog','purchases']};
function navItems(){
  const r = S.profile.role;
  const all = [['dashboard','#/'],['catalog','#/catalogo'],['purchases','#/acquisti'],['customers','#/clienti'],['orders','#/ordini'],['expenses','#/spese'],['reports','#/report'],['settings','#/impostazioni']];
  const allowed = {admin: all.map(a => a[0]), vendite:['dashboard','catalog','customers','orders','settings'], magazzino:['dashboard','catalog','purchases','settings']}[r];
  return all.filter(a => allowed.includes(a[0]));
}
function renderShell(){
  const main = MAIN_TABS[S.profile.role];
  const tabs = main.map(k => navItems().find(n => n[0] === k)).filter(Boolean);
  const more = navItems().filter(n => !main.includes(n[0]));
  $('#app').innerHTML = `<header class="top"><div class="top-row"><div class="brand"><img src="icons/mv-mark.png" alt="MV"><span>modus vestendi</span></div>
  <button class="menu-btn" id="mb" aria-label="${t('menu')}" aria-expanded="false" onclick="toggleMenu()"><span></span></button></div>
  <nav class="tabs">${tabs.map(([k, h]) => `<a href="${h}" data-k="${k}">${k === 'dashboard' ? t('home') : t(k)}</a>`).join('')}</nav>
  <div class="drop" id="drop" hidden>
    <div class="who">${esc(S.profile.full_name || S.profile.email || '')} · ${esc(ev('role', S.profile.role))}</div>
    ${more.map(([k, h]) => `<a href="${h}" data-k="${k}" onclick="toggleMenu(false)">${t(k)}</a>`).join('')}
    <div class="drop-row"><span>${t('language')}</span>${langSelect()}</div>
    <button class="link" onclick="logout()">${t('logout')}</button>
  </div></header><div class="menu-veil" id="veil" hidden onclick="toggleMenu(false)"></div><main id="main"></main>`;
}
function toggleMenu(open){
  const d = $('#drop'); if (!d) return;
  const show = open === undefined ? d.hidden : open;
  d.hidden = !show; $('#veil').hidden = !show; $('#mb').setAttribute('aria-expanded', show);
}
window.addEventListener('hashchange', () => S.profile?.role && route());
async function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [p, id] = h.split('/');
  const map = {'':['dashboard', viewDashboard], catalogo:['catalog', viewCatalog], articolo:['catalog', viewModel], acquisti:['purchases', viewPurchases], acquisto:['purchases', viewPurchase],
    clienti:['customers', viewCustomers], cliente:['customers', viewCustomer], ordini:['orders', viewOrders], ordine:['orders', viewOrder], spese:['expenses', viewExpenses], report:['reports', viewReports], impostazioni:['settings', viewSettings]};
  const [k, fn] = map[p] || map[''];
  document.querySelectorAll('nav.tabs a, .drop a').forEach(a => a.classList.toggle('on', a.dataset.k === k));
  $('#mb')?.classList.toggle('on', !MAIN_TABS[S.profile.role].includes(k));
  toggleMenu(false);
  if (!navItems().some(n => n[0] === k)) return (location.hash = '#/');
  const main = $('#main'); main.innerHTML = `<p class="muted">…</p>`;
  try { await fn(main, id ? Number(id) : null); } catch (e) { console.error(e); main.innerHTML = `<div class="card">${esc(e.message || e)}</div>`; }
  window.scrollTo(0, 0);
}

// ====== Panoramica ======
async function viewDashboard(main){
  const variants = check(await sb.from('variants').select('id,sku,size,color,qty,low_stock_threshold,models!inner(id,name,brand_id,archived)').eq('models.archived', false));
  const inStock = variants.reduce((a, v) => a + Math.max(0, v.qty), 0);
  const low = variants.filter(v => v.low_stock_threshold > 0 && v.qty <= v.low_stock_threshold);
  const pend = check(await sb.from('order_lines').select('qty,orders!inner(status)').eq('orders.status', 'confermato'));
  const committed = pend.reduce((a, l) => a + l.qty, 0);
  let kpis = `<div class="card kpi"><div class="v">${inStock + committed}</div><div class="l">${t('in_stock')}${committed ? ` · ${committed} ${t('of_which_ordered')}` : ''}</div></div>`;
  if (can.costs()){
    const vc = check(await sb.from('variant_costs').select('variant_id,landed_cost'));
    const cost = Object.fromEntries(vc.map(x => [x.variant_id, Number(x.landed_cost)]));
    const value = variants.reduce((a, v) => a + Math.max(0, v.qty) * (cost[v.id] || 0), 0);
    kpis += `<div class="card kpi"><div class="v">${eur(value)}</div><div class="l">${t('stock_value')}</div></div>`;
  }
  let recent = '', alerts = '';
  if (can.sales()){
    const act = check(await sb.from('orders').select('id,order_no,status,reserved_until,delivery_mode,shipped_at,customers(full_name)').in('status', ['riservato','confermato','spedito']).order('created_at'));
    const now = Date.now();
    const items = [];
    act.forEach(o => {
      const nm = esc(o.customers?.full_name || '');
      if (o.status === 'riservato' && o.reserved_until && new Date(o.reserved_until) < now) items.push(['bad', o, `${t('reservation_expired')}: ${nm}`]);
      else if (o.status === 'riservato') items.push(['warn', o, `${t('reserved_until_lbl')} ${fdt(o.reserved_until)}: ${nm}`]);
      else if (o.status === 'confermato') items.push(['warn', o, `${o.delivery_mode === 'modus_vestendi' ? t('to_deliver_own') : t('to_ship_choose')}: ${nm}`]);
      else if (o.status === 'spedito' && o.delivery_mode === 'modus_vestendi' && hoursSince(o.shipped_at) >= 24) items.push(['bad', o, `${t('confirm_delivery_ask')}: ${nm}`]);
    });
    const defs = check(await sb.from('defects').select('id,item_label,status,variant_id,variants(model_id)').in('status', ['da_restituire','inviato']));
    defs.forEach(d => items.push([d.status === 'inviato' ? 'warn' : 'bad', {order_no: t('defect'), id: null, _model: d.variants?.model_id}, `${esc(ev('defect_status', d.status))}: ${esc(d.item_label || '')}`]));
    if (items.length) alerts = `<div class="card"><h3>${t('to_do')}</h3>${items.map(([c, o, txt]) => `<div class="row" style="flex-wrap:nowrap;padding:9px 0;border-top:1px solid var(--line);cursor:pointer" onclick="location.hash='${o.id ? '#/ordine/' + o.id : '#/articolo/' + o._model}'"><span class="pill ${c}" style="flex:none">${esc(o.order_no)}</span><span style="min-width:0">${txt}</span></div>`).join('')}</div>`;
    const toShip = check(await sb.from('orders').select('id', {count:'exact', head:false}).eq('status', 'confermato'));
    const pays = check(await sb.from('payments').select('amount,kind').eq('status', 'da_incassare'));
    const due = pays.filter(p => p.kind !== 'rimborso').reduce((a, p) => a + Number(p.amount), 0);
    kpis += `<div class="card kpi"><div class="v">${toShip.length}</div><div class="l">${t('to_ship')}</div></div><div class="card kpi"><div class="v">${eur(due)}</div><div class="l">${t('to_collect')}</div></div>`;
    const ro = check(await sb.from('orders').select('id,order_no,order_date,status,customers(full_name)').neq('status', 'annullato').order('created_at', {ascending:false}).limit(8));
    recent = `<div class="card"><h3>${t('recent_orders')}</h3>${ro.length ? `<div class="table-wrap"><table>${ro.map(o => `<tr class="click" onclick="location.hash='#/ordine/${o.id}'"><td>${esc(o.order_no)}</td><td>${esc(o.customers?.full_name)}</td><td>${fdate(o.order_date)}</td><td>${statusPill('order_status', o.status)}</td></tr>`).join('')}</table></div>` : `<div class="empty">${t('no_data')}</div>`}</div>`;
  }
  if (can.admin()){
    const ml = check(await sb.from('v_line_margins').select('margin').in('status', ['confermato','spedito']));
    const tot = ml.reduce((a, r) => a + Number(r.margin || 0), 0);
    kpis += `<div class="card kpi" style="cursor:pointer;border-color:var(--accent)" onclick="showMarginDetail()"><div class="v" style="color:${tot >= 0 ? 'var(--good)' : 'var(--bad)'}">${eur(tot)}</div><div class="l">${t('margin_open')} ›</div></div>`;
  }
  main.innerHTML = `<h1>${t('dashboard')}</h1>${alerts}<div class="grid g4">${kpis}</div>${recent}
  <div class="card"><h3>${t('low_stock')}</h3>${low.length ? `<table>${low.map(v => `<tr class="click" onclick="location.hash='#/articolo/${v.models.id}'"><td>${esc(brandName(v.models.brand_id))} · ${esc(v.models.name)}</td><td>${esc(v.size || '')} ${esc(v.color || '')}</td><td class="right">${v.qty}</td></tr>`).join('')}</table>` : `<div class="empty">${t('no_data')}</div>`}</div>`;
}

let catFilter = {q:'', brand:'', cat:'', archived:false};
async function viewCatalog(main){
  const models = check(await sb.from('models').select('id,name,season,brand_id,category_id,instagram_status,variants(id,qty,sale_price),photos(path,is_main,sort)').eq('archived', !!catFilter.archived).order('created_at', {ascending:false}));
  const mains = models.map(m => { const ph = (m.photos || []).sort((a, b) => (b.is_main - a.is_main) || a.sort - b.sort)[0]; return ph?.path; });
  await signedUrls(mains);
  main.innerHTML = `<div class="row spread"><h1>${t('catalog')}</h1>${can.catalogWrite() ? `<button class="primary" onclick="newModel()">+ ${t('new_model')}</button>` : ''}</div>
  <div class="row" style="margin-bottom:14px"><input class="search" id="cq" placeholder="${t('search')}" value="${esc(catFilter.q)}">
  <select id="cb" style="max-width:200px"><option value="">${t('brand')}: ${t('all')}</option>${S.brands.map(b => `<option value="${b.id}" ${String(b.id) === catFilter.brand ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>
  <button class="${catFilter.archived ? 'primary' : ''}" onclick="catFilter.archived=!catFilter.archived;route()">${t('archived')}</button><select id="cc" style="max-width:240px"><option value="">${t('category')}: ${t('all')}</option>${catOptions().map(([k, l]) => `<option value="${k}" ${String(k) === catFilter.cat ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
  <div class="models" id="ml"></div>`;
  const draw = () => {
    const q = catFilter.q.toLowerCase();
    const list = models.map((m, i) => ({m, ph: mains[i]})).filter(({m}) =>
      (!catFilter.brand || String(m.brand_id) === catFilter.brand) &&
      (!catFilter.cat || String(m.category_id) === catFilter.cat || String(S.categories.find(c => c.id === m.category_id)?.parent_id) === catFilter.cat) &&
      (!q || (m.name + ' ' + brandName(m.brand_id) + ' ' + (m.season || '')).toLowerCase().includes(q)));

async function soldWithoutCost(){
  const [ol, vc] = await Promise.all([sb.from('order_lines').select('variant_id,orders!inner(status)').not('orders.status', 'in', '(annullato,bozza)'), sb.from('variant_costs').select('variant_id,purchase_price')]);
  const costed = new Set((vc.data || []).filter(x => x.purchase_price != null).map(x => x.variant_id));
  return new Set((ol.data || []).map(x => x.variant_id).filter(id => !costed.has(id)));
}
async function addPurchaseLine(pid){
  const flag = await soldWithoutCost();
  const vs = (await allVariants()).filter(v => !v.models?.archived).sort((a, b) => (flag.has(b.id) - flag.has(a.id)) || variantLabel(a).localeCompare(variantLabel(b)));
  const newF = ['brand_id','new_brand','category_id','name','size','color','sale_price','photos'], oldF = ['variant_id','add_stock'];
  const m = form({title:t('add_line'), fields:[
    {name:'line_kind', label:t('line_kind'), type:'select', empty:false, value:'new', options:[['new', t('lk_new')], ['existing', t('lk_existing')]]},
    {name:'variant_id', label:t('catalog'), type:'select', options:vs.map(v => [v.id, (flag.has(v.id) ? '⚠ ' + t('sold_no_cost') + ' · ' : '') + variantLabel(v)])},
    {name:'add_stock', label:t('add_stock_q'), type:'checkbox', value:false},
    {name:'brand_id', label:t('brand'), type:'select', options:S.brands.map(b => [b.id, b.name])},
    {name:'new_brand', label:`${t('brand')}: ${t('or_new')}`},

    {name:'name', label:t('name')},

    {name:'sale_price', label:t('sale_price'), type:'number'},
    {name:'photos', label:t('photos'), type:'file'},
    {name:'qty', label:t('qty'), type:'number', value:1, required:true},
    {name:'unit_price', label:t('purchase_price'), type:'number', required:true}
  ], onSubmit: async v => {
    let vid = null, toStock = true;
    if (v.line_kind === 'existing'){
      vid = v.variant_id; toStock = !!v.add_stock;
      if (!vid){ toast(t('pick_or_new'), true); throw new Error('item'); }
    } else {
      if (!v.name){ toast(t('pick_or_new'), true); throw new Error('item'); }
      await ensureBrand(v);
      const md = check(await sb.from('models').insert({brand_id: v.brand_id, category_id: v.category_id, name: v.name, list_price: v.sale_price}).select().single());
      await uploadPhotos(md.id, v.photos);
      const nv = check(await sb.from('variants').insert({model_id: md.id, size: v.size, color: v.color, sale_price: v.sale_price, status:'ordinato', sku: skuFor(md, v.size, v.color)}).select().single());
      vid = nv.id;
    }
    check(await sb.from('purchase_lines').insert({variant_id: vid, qty: v.qty, unit_price: v.unit_price, purchase_id: pid, add_to_stock: toStock}));
    if (toStock && window._purchase?.status === 'ricevuto'){
      check(await sb.from('stock_movements').insert({variant_id: vid, kind:'carico', qty: v.qty, reference:'acquisto #' + pid}));
      await sb.from('variants').update({status:'in_magazzino'}).eq('id', vid);
    }
    route(); }});
  const sel = m.querySelector('[name=line_kind]');
  const sync = () => { [...newF, ...oldF].forEach(n => { const el = m.querySelector(`[name=${n}]`); if (el) el.closest('.field').classList.toggle('hide', (sel.value === 'new') !== newF.includes(n)); }); };
  sel.addEventListener('change', sync); sync();
  const hint = document.createElement('p'); hint.className = 'small muted'; hint.style.margin = '-6px 0 12px'; hint.textContent = t('add_stock_hint');
  m.querySelector('[name=add_stock]').closest('.field').appendChild(hint);
}

// Estrazione dati dai DM (IT / EN / SQ)
function extractFromText(txt){
  const out = {};
  const n = '(\\d{2,3}(?:[.,]\\d)?)';
  const pick = (keys) => { for (const k of keys){ const r = new RegExp(k + '\\s*[:=]?\\s*' + n, 'i'); const m = txt.match(r); if (m) return Number(m[1].replace(',', '.')); } return null; };
  out.bust_cm = pick(['busto', 'seno', 'petto', 'bust', 'chest', 'gjoks[ia]?', 'kraharor[ri]?']);
  out.waist_cm = pick(['vita', 'waist', 'bel[ii]?', 'mesi']);
  out.hips_cm = pick(['fianchi', 'hips?', 'vithe[t]?', 'ijet?']);
  out.height_cm = pick(['altezza', 'alta', 'height', 'gjatësi[a]?', 'gjatesi[a]?']);
  out.weight_kg = pick(['peso', 'pesa', 'weight', 'kg', 'peshë', 'pesha', 'peshe']);
  const sz = txt.match(/(?:taglia|size|masa|masë|mase)\s*[:=]?\s*(XXS|XS|S|M|L|XL|XXL|\d{2})\b/i); if (sz) out.usual_size = sz[1].toUpperCase();
  const sh = txt.match(/(?:scarpe|numero|shoe|shoes|këpucë|kepuce|numri)\s*[:=]?\s*(\d{2}(?:[.,]5)?)/i); if (sh) out.shoe_size = sh[1];
  const ph = txt.match(/(\+?\d[\d\s\-]{7,}\d)/); if (ph) out.phone = ph[1].replace(/[\s\-]/g, '');
  const ad = txt.split('\n').find(l => /\b(rruga|rr\.|via|street|st\.|blv|bulevardi|lagjja|pallati)\b/i.test(l)); if (ad) out.address = ad.trim();
  Object.keys(out).forEach(k => out[k] == null && delete out[k]);
  return out;
}
async function analyzeDM(cid){
  const txt = $('#dm').value.trim(); if (!txt) return;
  const x = extractFromText(txt);
  check(await sb.from('messages').insert({customer_id: cid, body: txt, direction: $('#dmdir').value, extracted: x, source:'manuale'}));
  const keys = Object.keys(x);
  if (!keys.length){ toast(t('saved')); return route(); }
  const labels = {bust_cm:t('bust'), waist_cm:t('waist'), hips_cm:t('hips'), height_cm:t('height'), weight_kg:t('weight'), usual_size:t('usual_size'), shoe_size:t('shoe'), phone:t('phone'), address:t('address')};
  const m = modal(`<h3>${t('extracted')}</h3><form>${keys.map(k => `<div class="field"><label><input type="checkbox" name="${k}" checked style="width:auto"> ${labels[k]}</label><input name="v_${k}" value="${esc(x[k])}"></div>`).join('')}
  <div class="row" style="justify-content:flex-end"><button type="button" data-x>${t('close')}</button><button class="primary">${t('apply')}</button></div></form>`);
  m.querySelector('[data-x]').onclick = () => { m.remove(); route(); };
  m.querySelector('form').onsubmit = async e => {
    e.preventDefault(); const f = e.target.elements; const on = k => f[k] && f[k].checked; const val = k => f['v_' + k].value;
    const meas = {};
    ['bust_cm', 'waist_cm', 'hips_cm', 'height_cm', 'weight_kg'].forEach(k => { if (on(k)) meas[k] = num(val(k)); });
    ['usual_size', 'shoe_size'].forEach(k => { if (on(k)) meas[k] = val(k); });
    if (Object.keys(meas).length){
      const prev = window._meas || {};
      const base = {bust_cm:prev.bust_cm, waist_cm:prev.waist_cm, hips_cm:prev.hips_cm, height_cm:prev.height_cm, weight_kg:prev.weight_kg, shoe_size:prev.shoe_size, usual_size:prev.usual_size, brand_sizes:prev.brand_sizes || {}};
      check(await sb.from('customer_measurements').insert({...base, ...meas, customer_id: cid, notes:'da DM'}));
    }
    if (on('phone')) check(await sb.from('customers').update({phone: val('phone')}).eq('id', cid));
    if (on('address')) check(await sb.from('addresses').insert({customer_id: cid, line1: val('address'), country: window._customer.country}));
    m.remove(); toast(t('saved')); route();
  };
}

const fdt = d => d ? new Date(d).toLocaleString(LANG === 'en' ? 'en-GB' : LANG === 'sq' ? 'sq-AL' : 'it-IT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
function orderActions(od, tt, ships){
  const id = od.id;

  if (od.status === 'bozza' || od.status === 'riservato'){
    const expired = od.reserved_until && new Date(od.reserved_until) < new Date();
    return `<div class="help" style="border-color:${expired ? 'var(--bad)' : 'var(--line)'}">
      ${od.status === 'riservato' ? `<b>${t('reserved_until_lbl')} ${fdt(od.reserved_until)}</b>${expired ? ` · <span style="color:var(--bad)">${t('reservation_expired')}</span>` : ''}<br>` : ''}
      <div class="row" style="margin-top:8px"><button class="primary" onclick="confirmReservation(${id})">${t('confirm_order')}</button>
      ${od.status === 'riservato' ? `<button onclick="extendReservation(${id})">+24h</button>` : ''}
      <button class="danger" onclick="cancelOrder(${id})">${t(od.status === 'riservato' ? 'cancel_reservation' : 'cancel_order')}</button></div></div>`;
  }
  if (od.status === 'confermato'){

      <div class="row" style="margin-top:8px"><button class="primary" onclick="markShipped(${id})">${t('mark_shipped')}</button><button onclick="setDelivery(${id}, null)">${t('change_delivery')}</button></div></div>`;

      <div class="grid g2" style="margin-top:10px">
        <button class="primary" style="justify-content:center;padding:12px" onclick="shipWithCarrier(${id})">${t('ship_with')} ${esc(postman?.name || '')} ↗</button>
        <button class="accent" style="justify-content:center;padding:12px" onclick="setDelivery(${id}, 'modus_vestendi')">${t('deliver_ourselves')}</button>

  }
  if (od.status === 'spedito'){
    const late = od.delivery_mode === 'modus_vestendi' && hoursSince(od.shipped_at) >= 24;
    return `<div class="help" style="border-color:${late ? 'var(--warn)' : 'var(--line)'}">
      <b>${od.delivery_mode === 'modus_vestendi' ? t('own_delivery') : t('with_courier')}</b> · ${t('shipped_at_lbl')} ${fdt(od.shipped_at)}

      <div class="row" style="margin-top:8px"><button class="primary" onclick="confirmDelivery(${id}, ${Number(tt.to_collect) || 0})">${t('confirm_delivery')}</button></div></div>`;
  }
  return '';
}

let repF = {preset:'ytd', from:'', to:''};
const isoD = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
function repRange(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  switch (repF.preset){
    case 'month': return [isoD(new Date(y, m, 1)), isoD(now)];
    case 'last_month': return [isoD(new Date(y, m - 1, 1)), isoD(new Date(y, m, 0))];
    case 'ytd': return [isoD(new Date(y, 0, 1)), isoD(now)];
    case 'last12': return [isoD(new Date(y - 1, m, now.getDate() + 1)), isoD(now)];
    case 'all': return ['2000-01-01', isoD(now)];
    default: return [repF.from || isoD(new Date(y, 0, 1)), repF.to || isoD(now)];
  }
}
const prevYear = d => { const [a, b, c] = d.split('-'); return `${Number(a) - 1}-${b}-${c}`; };
async function viewReports(main){
  const [from, to] = repRange();
  const pf = prevYear(from), pt = prevYear(to);
  const okSt = ['confermato','spedito','consegnato','reso'];
  const [lines, exps, camps, buys, defs] = await Promise.all([
    sb.from('v_line_margins').select('*').in('status', okSt).gte('order_date', pf).lte('order_date', to).then(check),
    sb.from('expenses').select('*').gte('expense_date', pf).lte('expense_date', to).then(check),
    sb.from('campaigns').select('*').then(check),
    sb.from('purchase_lines').select('qty,unit_price,allocated_unit_cost,purchases!inner(purchase_date)').gte('purchases.purchase_date', pf).lte('purchases.purchase_date', to).then(check),
    sb.from('defects').select('*').in('status', ['rimborsato','perso']).gte('resolved_on', pf).lte('resolved_on', to).then(check)
  ]);
  const inR = (d, a, b) => d && d >= a && d <= b;
  const calc = (a, b) => {
    const L = lines.filter(l => inR(l.order_date, a, b));
    const gross = L.reduce((s, l) => s + Number(l.gross), 0), disc = L.reduce((s, l) => s + Number(l.discount_share), 0);
    const cogs = L.reduce((s, l) => s + Number(l.qty) * Number(l.landed_cost || 0), 0), ship = L.reduce((s, l) => s + Number(l.shipping_share), 0);
    const margin = L.reduce((s, l) => s + Number(l.margin), 0);
    const E = exps.filter(e => inR(e.expense_date, a, b)), exp = E.reduce((s, e) => s + Number(e.amount), 0);
    const C = camps.filter(c => inR(c.start_date || c.end_date, a, b)), camp = C.reduce((s, c) => s + Number(c.spend), 0);
    const bought = buys.filter(x => inR(x.purchases.purchase_date, a, b)).reduce((s, x) => s + x.qty * (Number(x.unit_price) + Number(x.allocated_unit_cost)), 0);
    const orders = new Set(L.map(l => l.order_id)).size;
    const loss = defs.filter(d => inR(d.resolved_on, a, b)).reduce((s, d) => s + Math.max(0, d.qty * Number(d.unit_cost || 0) - Number(d.refund_amount || 0)), 0);
    return {L, E, gross, disc, net: gross - disc, cogs, ship, margin, exp, camp, loss, profit: margin - exp - camp - loss, bought, orders, pieces: L.reduce((s, l) => s + l.qty, 0)};
  };
  const cur = calc(from, to), prev = calc(pf, pt);
  const delta = (a, b) => { if (!b) return ''; const d = (a - b) / Math.abs(b) * 100; return `<span class="small" style="color:${d >= 0 ? 'var(--good)' : 'var(--bad)'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(d))}%</span>`; };
  const kpi = (label, a, b, money = true) => `<div class="card kpi"><div class="v">${money ? eur(a) : a}</div><div class="l">${label}</div><div class="small muted">${t('prev_year')}: ${money ? eur(b) : b} ${money ? delta(a, b) : ''}</div></div>`;
  const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 + '%' : '—';
  // per mese
  const months = {};
  cur.L.forEach(l => { const k = l.order_date.slice(0, 7); const m = months[k] = months[k] || {net:0, cogs:0, ship:0, margin:0, exp:0, camp:0}; m.net += Number(l.gross) - Number(l.discount_share); m.cogs += l.qty * Number(l.landed_cost || 0); m.ship += Number(l.shipping_share); m.margin += Number(l.margin); });
  cur.E.forEach(e => { const k = e.expense_date.slice(0, 7); (months[k] = months[k] || {net:0, cogs:0, ship:0, margin:0, exp:0, camp:0}).exp += Number(e.amount); });
  camps.filter(c => inR(c.start_date || c.end_date, from, to)).forEach(c => { const k = (c.start_date || c.end_date).slice(0, 7); (months[k] = months[k] || {net:0, cogs:0, ship:0, margin:0, exp:0, camp:0}).camp += Number(c.spend); });
  // per marca / categoria spese
  const brands = {};
  cur.L.forEach(l => { const b = (l.item || '').split(' ')[0] || '—'; const x = brands[b] = brands[b] || {q:0, net:0, margin:0}; x.q += l.qty; x.net += Number(l.gross) - Number(l.discount_share); x.margin += Number(l.margin); });
  const expCat = {};
  cur.E.forEach(e => { expCat[e.category] = (expCat[e.category] || 0) + Number(e.amount); });
  const presets = [['month', t('p_month')], ['last_month', t('p_last_month')], ['ytd', 'YTD'], ['last12', t('p_last12')], ['all', t('all')], ['custom', t('p_custom')]];
  main.innerHTML = `<h1>${t('reports')}</h1>
  <div class="chips" style="margin-bottom:10px">${presets.map(([k, l]) => `<button class="${repF.preset === k ? 'primary' : ''}" onclick="repF.preset='${k}';route()">${l}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input type="date" id="rf" value="${from}"><span>→</span><input type="date" id="rt" value="${to}"></div>
  <p class="small muted" style="margin:0 0 14px">${t('yoy_vs')} ${fdate(pf)} – ${fdate(pt)}</p>
  <div class="grid g4">
    ${kpi(t('revenue_net'), cur.net, prev.net)}
    ${kpi(t('gross_margin'), cur.margin, prev.margin)}
    ${kpi(t('net_profit'), cur.profit, prev.profit)}
    ${kpi(t('orders') + ' · ' + t('qty_pieces').toLowerCase(), `${cur.orders} · ${cur.pieces}`, `${prev.orders} · ${prev.pieces}`, false)}
  </div>
  <div class="card"><h3>${t('pnl')}</h3><table class="pnl"><tr><th></th><th class="right">${t('period')}</th><th class="right">${t('prev_year')}</th></tr>
    <tr><td>${t('revenue')} (${t('gross_lbl')})</td><td class="right">${eur(cur.gross)}</td><td class="right small muted">${eur(prev.gross)}</td></tr>
    <tr><td>− ${t('discount')}</td><td class="right">${eur(cur.disc)}</td><td class="right small muted">${eur(prev.disc)}</td></tr>
    <tr><td><b>${t('revenue_net')}</b></td><td class="right"><b>${eur(cur.net)}</b></td><td class="right small muted">${eur(prev.net)}</td></tr>
    <tr><td>− ${t('goods_cost')}</td><td class="right">${eur(cur.cogs)}</td><td class="right small muted">${eur(prev.cogs)}</td></tr>
    <tr><td>− ${t('shipping_cost')}</td><td class="right">${eur(cur.ship)}</td><td class="right small muted">${eur(prev.ship)}</td></tr>
    <tr><td><b>${t('gross_margin')}</b> <span class="small muted">${pct(cur.margin, cur.net)}</span></td><td class="right"><b>${eur(cur.margin)}</b></td><td class="right small muted">${eur(prev.margin)}</td></tr>
    <tr><td>− ${t('expenses')}</td><td class="right">${eur(cur.exp)}</td><td class="right small muted">${eur(prev.exp)}</td></tr>
    <tr><td>− ${t('campaigns')}</td><td class="right">${eur(cur.camp)}</td><td class="right small muted">${eur(prev.camp)}</td></tr>
    <tr><td>− ${t('defect_loss')}</td><td class="right">${eur(cur.loss)}</td><td class="right small muted">${eur(prev.loss)}</td></tr>
    <tr><td><b>${t('net_profit')}</b> <span class="small muted">${pct(cur.profit, cur.net)}</span></td><td class="right"><b style="color:${cur.profit >= 0 ? 'var(--good)' : 'var(--bad)'}">${eur(cur.profit)}</b></td><td class="right small muted">${eur(prev.profit)}</td></tr>
    <tr><td class="small muted">${t('goods_bought')}</td><td class="right small muted">${eur(cur.bought)}</td><td class="right small muted">${eur(prev.bought)}</td></tr>
  </table><p class="small muted">${t('pnl_hint')}</p></div>
  <div class="card"><h3>${t('by_month')}</h3><div class="table-wrap"><table><tr><th></th><th class="right">${t('revenue_net')}</th><th class="right">${t('goods_cost')}</th><th class="right">${t('gross_margin')}</th><th class="right">${t('expenses')}</th><th class="right">${t('campaigns')}</th><th class="right">${t('net_profit')}</th></tr>
  ${Object.keys(months).sort().reverse().map(k => { const m = months[k]; return `<tr><td>${k}</td><td class="right">${eur(m.net)}</td><td class="right">${eur(m.cogs + m.ship)}</td><td class="right">${eur(m.margin)}</td><td class="right">${eur(m.exp)}</td><td class="right">${eur(m.camp)}</td><td class="right"><b>${eur(m.margin - m.exp - m.camp)}</b></td></tr>`; }).join('') || `<tr><td colspan="7" class="empty">${t('no_data')}</td></tr>`}</table></div></div>

function editCarrier(id){
  const c = id ? S.carriers.find(x => x.id === id) : {};
  form({title:t('carrier'), fields:[{name:'name', label:t('name'), required:true},{name:'tracking_url_template', label:t('tracking_template')},{name:'notes', label:t('notes')}], values:c,
    onSubmit: async v => { if (id) check(await sb.from('carriers').update(v).eq('id', id)); else check(await sb.from('carriers').insert(v)); await loadRefs(); route(); }});
}
function addCategory(){
  form({title:t('category'), fields:[{name:'name', label:t('name') + ' (IT)', required:true},{name:'name_en', label:t('name') + ' (EN)'},{name:'name_sq', label:t('name') + ' (SQ)'},{name:'parent_id', label:t('inside'), type:'select', options:S.categories.filter(c => !c.parent_id).map(c => [c.id, catName(c)])}],
    onSubmit: async v => { check(await sb.from('categories').insert(v)); await loadRefs(); route(); }});
}
function addBrand(){
  form({title:t('brand'), fields:[{name:'name', label:t('name'), required:true},{name:'country', label:t('country')},{name:'size_guide', label:t('size_guide'), type:'textarea'}],
    onSubmit: async v => { check(await sb.from('brands').insert(v)); await loadRefs(); route(); }});
}
async function exportCsv(table){
  const rows = check(await sb.from(table).select('*').limit(10000));
  if (!rows.length) return toast(t('no_data'));
  const cols = Object.keys(rows[0]);
  const cell = v => { if (v == null) return ''; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '\ufeff' + [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = `mv_${table}_${today()}.csv`; a.click();
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') renderLogin(); });
boot();
