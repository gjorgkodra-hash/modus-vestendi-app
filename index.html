<style>
:root{
  /* palette dal logo MV: crema, cuoio, cucitura marrone, inchiostro */
  --bg:#e6dfd5; --surface:#faf7f2; --ink:#2c2527; --muted:#6e605a; --line:#d8ccbf;
  --accent:#4c2f2a; --tan:#deb598; --accent-soft:#f1e1d2; --good:#3f7350; --warn:#a8711f; --bad:#a63d3d;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,"Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
h1,h2,h3{font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:700;margin:0 0 .5em;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:nowrap}
.top-row .row{flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Jost,"Century Gothic",sans-serif;font-size:17px;letter-spacing:.12em;text-transform:lowercase;color:var(--ink)}
.brand img{height:30px;width:auto}
.login-logo{display:block;width:150px;max-width:60%;margin:4px auto 6px}
.tagline{text-align:center;font-family:Jost,sans-serif;letter-spacing:.18em;font-size:14px;color:var(--ink);margin:0 0 18px}
.top-row select{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
nav.tabs{display:flex;gap:4px;padding:8px 0 0}
nav.tabs a{flex:1 1 0;min-width:0;text-align:center;color:var(--muted);text-decoration:none;padding:9px 4px;border-radius:10px 10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
nav.tabs a.on{background:var(--tan);color:var(--ink);font-weight:600}
.menu-btn{border:1px solid var(--line);background:transparent;width:40px;height:40px;padding:0;justify-content:center;flex:none}
.menu-btn span,.menu-btn span::before,.menu-btn span::after{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;position:relative;content:""}
.menu-btn span::before{position:absolute;top:-6px}.menu-btn span::after{position:absolute;top:6px}
.menu-btn.on{background:var(--tan);border-color:var(--accent)}
.drop{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(44,37,39,.12);padding:6px 16px 14px;transform-origin:top;animation:drop .18s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.drop{animation:none}}
.drop a,.drop .drop-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:16px}
.drop a.on{font-weight:600}
.drop a.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.drop .who{padding:10px 4px 4px;color:var(--muted);font-size:13px}
.drop button.link{font-size:16px;padding:13px 4px;color:var(--bad)}
.menu-veil{position:fixed;inset:0;z-index:15;background:rgba(44,37,39,.25)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-size:24px;font-weight:600}
.kpi .l{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
button.accent{background:var(--tan);color:var(--ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:#e9c6c6}
button.link{border:none;background:none;color:var(--accent);padding:4px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:90px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.search{max-width:340px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.card > table{display:block;overflow-x:auto}
.card > table > tbody{display:table;width:100%}
main > .row.spread{margin-bottom:14px}
.card > table.pnl{display:table}
.pnl td:first-child{white-space:normal}
.help{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:14px}
.help b{color:var(--accent)}
.sep{margin:6px 0 12px;font-size:13px;color:var(--muted);text-align:center}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
tr.click{cursor:pointer} tr.click:hover{background:var(--accent-soft)}
.table-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:#e3f1e8;color:var(--good)} .pill.warn{background:#fbf0dc;color:var(--warn)} .pill.bad{background:#f7e1e1;color:var(--bad)} .pill.grey{background:#eee;color:#666}
.models{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.model{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer}
.model .ph{aspect-ratio:3/4;background:var(--accent-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b5a796;font-size:13px}
.model .b{padding:10px}
.model .n{font-weight:600;font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo-add{width:96px;height:128px;border:2px dashed var(--accent);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-size:13px;text-align:center;cursor:pointer;background:var(--accent-soft);padding:6px}
.photo-add .plus{font-size:28px;line-height:1}
.file-box{display:flex;align-items:center;gap:12px;border:2px dashed var(--accent);border-radius:12px;padding:14px;background:var(--accent-soft);color:var(--accent);cursor:pointer;margin:0}
.file-box .plus{font-size:26px;line-height:1}
.file-prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.file-prev img{width:56px;height:74px;object-fit:cover;border-radius:8px}
.photos .p{width:96px;height:128px;border-radius:10px;background:var(--accent-soft) center/cover;position:relative;border:2px solid transparent}
.photos .p.main{border-color:var(--accent)}
.photos .p button{position:absolute;bottom:4px;right:4px;padding:2px 6px;font-size:11px}
.matrix td,.matrix th{text-align:center}
.matrix td.q{font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
.toast.err{background:var(--bad)}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login{max-width:380px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.msg{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;white-space:pre-wrap}
.msg.out{border-color:var(--accent)}
.right{text-align:right}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.hide{display:none!important}
</style>
</head>

  ce_how:['Come si calcola: una conversazione o un cliente nuovo viene attribuito alla campagna che spendeva di più quel giorno o nei 2 giorni prima. Gli ordini di quel cliente nei 60 giorni dopo il primo contatto contano come incassi della campagna. Se nella scheda del cliente scegli la campagna a mano, vale quella. I follower sono il totale del profilo in quei giorni, divisi tra le campagne attive in base alla spesa (Meta dà i follower solo degli ultimi 30 giorni: da ora in poi si accumulano).','How it is calculated: a new conversation or customer goes to the campaign that spent most that day or in the 2 days before. That customer’s orders in the 60 days after first contact count as the campaign’s revenue. If you pick the campaign by hand on the customer page, that one is used. Followers are the profile total on those days, split between running campaigns by spend (Meta only gives the last 30 days of followers; from now on they add up).','Si llogaritet: një bisedë ose klient i ri i jepet fushatës që shpenzoi më shumë atë ditë ose 2 ditët para. Porositë e atij klienti në 60 ditët pas kontaktit të parë llogariten si të ardhura të fushatës. Nëse në kartelën e klientit zgjedh fushatën me dorë, vlen ajo. Ndjekësit janë totali i profilit në ato ditë, ndarë mes fushatave aktive sipas shpenzimit (Meta jep ndjekësit vetëm për 30 ditët e fundit; nga tani e tutje mblidhen).'],

function statusPill(group, v){
  const good = ['in_magazzino','consegnato','incassato','consegnato_dal_corriere','ricevuto','trovata','attiva'];
  const warn = ['bozza','da_incassare','da_spedire','in_arrivo','ordinato','riservato','in_dogana','aperta','da_ordinare'];
  const bad = ['annullato','problema','reso','venduto','fermata'];
  const cls = good.includes(v) ? 'good' : warn.includes(v) ? 'warn' : bad.includes(v) ? 'bad' : '';
  return `<span class="pill ${cls}">${esc(ev(group, v))}</span>`;
}

    const v = values[f.name] ?? f.value ?? '';

    else if (f.type === 'textarea') input = `<textarea name="${f.name}">${esc(v)}</textarea>`;
    else if (f.type === 'sizes') input = sizesEditor(f.name);

async function resizeImage(file, max = 1600){
  const img = await createImageBitmap(file);
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
}
const urlCache = {};
async function signedUrls(paths){
  const need = [...new Set(paths.filter(p => p && !urlCache[p]))];
  if (need.length){
    const { data } = await sb.storage.from('foto').createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d.signedUrl) urlCache[d.path] = d.signedUrl; });
  }
  return urlCache;
}

async function soldWithoutCost(){
  const [ol, vc] = await Promise.all([sb.from('order_lines').select('variant_id,orders!inner(status)').not('orders.status', 'in', '(annullato,bozza)'), sb.from('variant_costs').select('variant_id,purchase_price')]);
  const costed = new Set((vc.data || []).filter(x => x.purchase_price != null).map(x => x.variant_id));
  return new Set((ol.data || []).map(x => x.variant_id).filter(id => !costed.has(id)));
}
async function addPurchaseLine(pid){
  const flag = await soldWithoutCost();
  const vs = (await allVariants()).filter(v => !v.models?.archived).sort((a, b) => (flag.has(b.id) - flag.has(a.id)) || variantLabel(a).localeCompare(variantLabel(b)));
  const models = [...new Map(vs.map(v => [v.model_id, {id: v.model_id, name: v.models?.name, brand_id: v.models?.brand_id}])).values()].sort((a, b) => (brandName(a.brand_id) + a.name).localeCompare(brandName(b.brand_id) + b.name));
  const SHOW = {new: ['brand_id','new_brand','category_id','gender','name','color','sale_price','sizes','photos'], model: ['model_id','color','sizes','add_stock'], existing: ['variant_id','add_stock','qty'], sold: ['sold_variant_id','qty']};
  const ALL = [...new Set(Object.values(SHOW).flat())];
  const m = form({title:t('add_line'), fields:[
    {name:'line_kind', label:t('line_kind'), type:'select', empty:false, value: flag.size ? 'sold' : 'new', options:[...(flag.size ? [['sold', `⚠ ${t('lk_sold')} (${flag.size})`]] : []), ['new', t('lk_new')], ['model', t('lk_model')], ['existing', t('lk_existing')]]},
    {name:'sold_variant_id', label:t('lk_sold'), type:'select', empty:false, options:vs.filter(v => flag.has(v.id)).map(v => [v.id, variantLabel(v)])},
    {name:'variant_id', label:t('catalog'), type:'select', options:vs.map(v => [v.id, (flag.has(v.id) ? '⚠ ' + t('sold_no_cost') + ' · ' : '') + variantLabel(v)])},
    {name:'model_id', label:t('lk_model_pick'), type:'select', options:models.map(x => [x.id, `${brandName(x.brand_id)} · ${x.name}`])},
    {name:'brand_id', label:t('brand'), type:'select', options:S.brands.map(b => [b.id, b.name])},
    {name:'new_brand', label:`${t('brand')}: ${t('or_new')}`},
    {name:'category_id', label:t('category'), type:'select', options:catOptions()},
    {name:'gender', label:t('gender'), type:'select', options:opts('gender'), empty:false, value:'donna'},
    {name:'name', label:t('name')},
    {name:'color', label:t('color'), type:'colorname'},
    {name:'sale_price', label:t('sale_price'), type:'number'},
    {name:'sizes', label:t('sizes_stock'), type:'sizes'},
    {name:'photos', label:t('photos'), type:'file'},
    {name:'add_stock', label:t('add_stock_q'), type:'checkbox', value:false},
    {name:'qty', label:t('qty'), type:'number', value:1},
    {name:'unit_price', label:t('purchase_price') + ' (' + t('per_piece') + ')', type:'number', required:true}
  ], onSubmit: async v => {
    const received = window._purchase?.status === 'ricevuto';
    const addLine = async (vid, qty, toStock) => {
      check(await sb.from('purchase_lines').insert({variant_id: vid, qty, unit_price: v.unit_price, purchase_id: pid, add_to_stock: toStock}));
      if (toStock && received){
        check(await sb.from('stock_movements').insert({variant_id: vid, kind:'carico', qty, reference:'acquisto #' + pid}));
        await sb.from('variants').update({status:'in_magazzino'}).eq('id', vid);
      }
    };
    const sizes = (v.sizes || []).filter(r => (r.qty || 0) > 0);
    if (v.line_kind === 'sold' || v.line_kind === 'existing'){
      const vid = v.line_kind === 'sold' ? v.sold_variant_id : v.variant_id;
      if (!vid){ toast(t('pick_or_new'), true); throw new Error('item'); }
      await addLine(vid, v.qty || 1, v.line_kind === 'existing' && !!v.add_stock);
      const mv = vs.find(x => x.id === Number(vid));
      if (mv) await offerSameCost(mv.model_id, v.unit_price, pid, [Number(vid)]);
    } else if (v.line_kind === 'model'){
      if (!v.model_id){ toast(t('pick_or_new'), true); throw new Error('item'); }
      if (!sizes.length){ toast(t('lk_need_sizes'), true); throw new Error('sizes'); }
      const mid = Number(v.model_id), mm = models.find(x => x.id === mid);
      const same = vs.filter(x => x.model_id === mid);
      const col = (v.color || '').trim(), ref = same.find(x => (x.color || '').trim().toLowerCase() === col.toLowerCase()) || same[0] || {};
      for (const r of sizes){
        const sz = (r.size || 'TU').trim();
        let ex = same.find(x => String(x.size || 'TU').toUpperCase() === sz.toUpperCase() && (x.color || '').trim().toLowerCase() === col.toLowerCase());
        if (!ex) ex = await insertVariant({model_id: mid, size: sz, color: col || null, color_hex: v.color_hex || ref.color_hex || null, sale_price: ref.sale_price ?? null, status: v.add_stock && received ? 'in_magazzino' : 'ordinato', sku: skuFor(mm, sz, col)});
        await addLine(ex.id, r.qty, !!v.add_stock);
      }
      await offerSameCost(mid, v.unit_price, pid, []);
    } else {
      if (!v.name){ toast(t('pick_or_new'), true); throw new Error('item'); }
      if (!sizes.length){ toast(t('lk_need_sizes'), true); throw new Error('sizes'); }
      await ensureBrand(v);
      const md = check(await sb.from('models').insert({brand_id: v.brand_id, category_id: v.category_id, gender: v.gender || 'donna', name: v.name, list_price: v.sale_price}).select().single());
      await uploadPhotos(md.id, v.photos);
      for (const r of sizes){
        const sz = (r.size || 'TU').trim();
        const nv = await insertVariant({model_id: md.id, size: sz, color: v.color, color_hex: v.color_hex, sale_price: v.sale_price, status:'ordinato', sku: skuFor(md, sz, v.color)});
        await addLine(nv.id, r.qty, true);
      }
    }
    route(); }});
  const sel = m.querySelector('[name=line_kind]');
  const fieldOf = n => (m.querySelector(`[name=${n}]`) || m.querySelector(`[data-sz="${n}"]`))?.closest('.field');
  const sync = () => { const show = SHOW[sel.value]; ALL.forEach(n => { const el = fieldOf(n); if (el) el.classList.toggle('hide', !show.includes(n)); });
    m.querySelector('[name=add_stock]').checked = sel.value === 'model'; };
  sel.addEventListener('change', sync); sync();
  // pick a product -> suggest its colour
  m.querySelector('[name=model_id]').addEventListener('change', e => { const c = vs.find(x => x.model_id === Number(e.target.value) && x.color); const ci = m.querySelector('[name=color]'); if (c && ci && sel.value === 'model'){ ci.value = c.color.trim(); ci.dispatchEvent(new Event('input')); } });
  const hint = document.createElement('p'); hint.className = 'small muted'; hint.style.margin = '-6px 0 12px'; hint.textContent = t('add_stock_hint');
  m.querySelector('[name=add_stock]').closest('.field').appendChild(hint);
}
async function deleteModel(id){
  const m = window._model;
  const vids = m.variants.map(v => v.id).concat([0]);
  const [used, bought] = await Promise.all([sb.from('order_lines').select('id').in('variant_id', vids).limit(1).then(check), sb.from('purchase_lines').select('id').in('variant_id', vids).limit(1).then(check)]);
  if (used.length || bought.length) return toast(t('model_has_history'), true);
  if (!confirm(`${t('delete')}: ${brandName(m.brand_id)} ${m.name}?\n${t('delete_model_hint')}`)) return;
  if (m.photos.length) await sb.storage.from('foto').remove(m.photos.map(p => p.path));
  check(await sb.from('models').delete().eq('id', m.id));
  toast(t('saved')); location.hash = '#/catalogo';
}
async function deleteOrder(id){

}

// Estrazione dati dai DM (IT / EN / SQ)
function extractFromText(txt){
  const out = {};
  const n = '(\\d{2,3}(?:[.,]\\d)?)';
  const pick = (keys) => { for (const k of keys){ const r = new RegExp(k + '\\s*[:=]?\\s*' + n, 'i'); const m = txt.match(r); if (m) return Number(m[1].replace(',', '.')); } return null; };
  out.bust_cm = pick(['busto', 'seno', 'petto', 'bust', 'chest', 'gjoks[ia]?', 'kraharor[ri]?']);
  out.waist_cm = pick(['vita', 'waist', 'bel[ii]?', 'mesi']);
  out.hips_cm = pick(['fianchi', 'hips?', 'vithe[t]?', 'ijet?']);
  out.height_cm = pick(['altezza', 'alta', 'height', 'gjatësi[a]?', 'gjatesi[a]?']);
  out.weight_kg = pick(['peso', 'pesa', 'weight', 'kg', 'peshë', 'pesha', 'peshe']);
  const sz = txt.match(/(?:taglia|size|masa|masë|mase)\s*[:=]?\s*(XXS|XS|S|M|L|XL|XXL|\d{2})\b/i); if (sz) out.usual_size = sz[1].toUpperCase();
  const sh = txt.match(/(?:scarpe|numero|shoe|shoes|këpucë|kepuce|numri)\s*[:=]?\s*(\d{2}(?:[.,]5)?)/i); if (sh) out.shoe_size = sh[1];
  const ph = txt.match(/(\+?\d[\d\s\-]{7,}\d)/); if (ph) out.phone = ph[1].replace(/[\s\-]/g, '');
  const ad = txt.split('\n').find(l => /\b(rruga|rr\.|via|street|st\.|blv|bulevardi|lagjja|pallati)\b/i.test(l)); if (ad) out.address = ad.trim();
  Object.keys(out).forEach(k => out[k] == null && delete out[k]);
  return out;
}
async function analyzeDM(cid){
  const txt = $('#dm').value.trim(); if (!txt) return;
  const x = extractFromText(txt);
  check(await sb.from('messages').insert({customer_id: cid, body: txt, direction: $('#dmdir').value, extracted: x, source:'manuale'}));
  const keys = Object.keys(x);
  if (!keys.length){ toast(t('saved')); return route(); }
  const labels = {bust_cm:t('bust'), waist_cm:t('waist'), hips_cm:t('hips'), height_cm:t('height'), weight_kg:t('weight'), usual_size:t('usual_size'), shoe_size:t('shoe'), phone:t('phone'), address:t('address')};
  const m = modal(`<h3>${t('extracted')}</h3><form>${keys.map(k => `<div class="field"><label><input type="checkbox" name="${k}" checked style="width:auto"> ${labels[k]}</label><input name="v_${k}" value="${esc(x[k])}"></div>`).join('')}
  <div class="row" style="justify-content:flex-end"><button type="button" data-x>${t('close')}</button><button class="primary">${t('apply')}</button></div></form>`);
  m.querySelector('[data-x]').onclick = () => { m.remove(); route(); };
  m.querySelector('form').onsubmit = async e => {
    e.preventDefault(); const f = e.target.elements; const on = k => f[k] && f[k].checked; const val = k => f['v_' + k].value;
    const meas = {};
    ['bust_cm', 'waist_cm', 'hips_cm', 'height_cm', 'weight_kg'].forEach(k => { if (on(k)) meas[k] = num(val(k)); });
    ['usual_size', 'shoe_size'].forEach(k => { if (on(k)) meas[k] = val(k); });
    if (Object.keys(meas).length){
      const prev = window._meas || {};
      const base = {bust_cm:prev.bust_cm, waist_cm:prev.waist_cm, hips_cm:prev.hips_cm, height_cm:prev.height_cm, weight_kg:prev.weight_kg, shoe_size:prev.shoe_size, usual_size:prev.usual_size, brand_sizes:prev.brand_sizes || {}};
      check(await sb.from('customer_measurements').insert({...base, ...meas, customer_id: cid, notes:'da DM'}));
    }
    if (on('phone')) check(await sb.from('customers').update({phone: val('phone')}).eq('id', cid));
    if (on('address')) check(await sb.from('addresses').insert({customer_id: cid, line1: val('address'), country: window._customer.country}));
    m.remove(); toast(t('saved')); route();
  };
}

    return `<div class="help" style="border-color:${late ? 'var(--warn)' : 'var(--line)'}">

  }
  return '';

  const setOut = k => { state.out = k; m.querySelectorAll('#fb_out button').forEach(b => b.classList.toggle('primary', b.dataset.k === k));
    m.querySelector('#fb_lines').hidden = k === 'tutto_ok';

      } });

// small single-series SVG chart with hover tooltip (one axis, recessive grid)
const sdate = d => String(d).slice(8, 10) + '.' + String(d).slice(5, 7);
function miniChart(id, pts, {type = 'line', money = false} = {}){
  const W = 640, H = 230, P = {l: 70, r: 12, t: 14, b: 34}, FS = 17;
  const vals = pts.map(p => p.v).filter(v => v != null);
  if (vals.length < 2) return `<p class="small muted" style="margin:24px 0;text-align:center">${t('ig_no_data_yet')}</p>`;
  let mn = type === 'bar' ? 0 : Math.min(...vals), mx = Math.max(...vals);
  if (mx === mn){ mx += 1; if (type !== 'bar') mn -= 1; }
  const pad = (mx - mn) * .08; if (type !== 'bar'){ mn -= pad; } mx += pad;
  const x = i => P.l + (W - P.l - P.r) * (pts.length === 1 ? .5 : i / (pts.length - 1));
  const bw = Math.max(2, (W - P.l - P.r) / pts.length - 2);
  const xb = i => P.l + (W - P.l - P.r) * (i + .5) / pts.length;
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - mn) / (mx - mn));
  const fmt = v => money ? eur(v) : fnum(v);
  const ticks = [0, .5, 1].map(f => mn + (mx - mn) * f);
  const grid = ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="${FS}" fill="var(--muted)">${money ? Math.round(v) + '€' : fnum(v)}</text>`).join('');
  const lab = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map(i => `<text x="${type === 'bar' ? xb(i) : x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}" font-size="${FS}" fill="var(--muted)">${sdate(pts[i].d)}</text>`).join('');
  let marks = '';
  if (type === 'bar') marks = pts.map((p, i) => p.v == null ? '' : `<rect x="${xb(i) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, y(mn) - y(p.v))}" rx="${Math.min(4, bw / 2)}" fill="var(--accent)" opacity=".85"/>`).join('');
  else { const d = pts.map((p, i) => p.v == null ? null : `${x(i)},${y(p.v)}`).filter(Boolean); marks = `<polyline points="${d.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`; }
  const hits = pts.map((p, i) => { const cx = type === 'bar' ? xb(i) : x(i), w = (W - P.l - P.r) / pts.length; return `<rect class="hit" x="${cx - w / 2}" y="${P.t}" width="${w}" height="${H - P.t - P.b}" fill="transparent" data-i="${i}" data-x="${cx}" data-y="${p.v == null ? '' : y(p.v)}"/>`; }).join('');
  window['_ch_' + id] = {pts, fmt};
  return `<div class="chart" id="${id}" style="position:relative"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" onmousemove="chartHover(event,'${id}')" ontouchstart="chartHover(event,'${id}')" onmouseleave="chartOut('${id}')">${grid}${marks}${lab}<line class="cx" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle class="cd" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>${hits}</svg><div class="tip" style="position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:4px 8px;border-radius:6px;display:none;white-space:nowrap"></div></div>`;
}
function chartHover(ev, id){
  const el = document.getElementById(id); if (!el) return;
  const tg = (ev.touches ? document.elementFromPoint(ev.touches[0].clientX, ev.touches[0].clientY) : ev.target);
  if (!tg || !tg.classList.contains('hit')) return;
  const {pts, fmt} = window['_ch_' + id], p = pts[+tg.dataset.i], svg = el.querySelector('svg'), sc = svg.getBoundingClientRect().width / 640;
  const cx = svg.querySelector('.cx'), cd = svg.querySelector('.cd');
  cx.setAttribute('x1', tg.dataset.x); cx.setAttribute('x2', tg.dataset.x); cx.setAttribute('visibility', 'visible');
  if (tg.dataset.y){ cd.setAttribute('cx', tg.dataset.x); cd.setAttribute('cy', tg.dataset.y); cd.setAttribute('visibility', 'visible'); } else cd.setAttribute('visibility', 'hidden');
  const tip = el.querySelector('.tip'); tip.textContent = `${fdate(p.d)} · ${p.v == null ? '—' : fmt(p.v)}`; tip.style.display = 'block';
  const left = Math.min(Math.max(0, tg.dataset.x * sc - tip.offsetWidth / 2), el.clientWidth - tip.offsetWidth); tip.style.left = left + 'px';
}
function chartOut(id){ const el = document.getElementById(id); if (!el) return; el.querySelector('.tip').style.display = 'none'; el.querySelectorAll('.cx,.cd').forEach(x => x.setAttribute('visibility', 'hidden')); }

function pairChart(id, pts, la, lb){
  const W = 640, H = 230, P = {l: 70, r: 12, t: 14, b: 34}, FS = 17;
  if (pts.length < 2) return `<p class="small muted" style="margin:24px 0;text-align:center">${t('ig_no_data_yet')}</p>`;
  const mx = Math.max(1, ...pts.map(p => Math.max(p.a, p.b))) * 1.08;
  const slot = (W - P.l - P.r) / pts.length, bw = Math.max(2, slot / 2 - 2), y = v => P.t + (H - P.t - P.b) * (1 - v / mx);
  const grid = [0, .5, 1].map(f => mx * f).map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="${FS}" fill="var(--muted)">${Math.round(v)}€</text>`).join('');
  const bars = pts.map((p, i) => { const x0 = P.l + slot * i + slot / 2;
    return `<rect x="${x0 - bw - 1}" y="${y(p.a)}" width="${bw}" height="${y(0) - y(p.a)}" rx="2" fill="var(--accent)"/><rect x="${x0 + 1}" y="${y(p.b)}" width="${bw}" height="${y(0) - y(p.b)}" rx="2" fill="var(--good)"/>

  return `<div class="row small" style="gap:14px;margin-bottom:4px"><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent)"></span> ${la}</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--good)"></span> ${lb}</span></div>

}

// Instagram accepts JPEG with aspect ratio between 4:5 and 1.91:1 → crop or pad portrait photos to 4:5
async function igPrepare(path, mode){
  const {data, error} = await sb.storage.from('foto').download(path); if (error) throw error;
  const img = await createImageBitmap(data); let w = img.width, h = img.height, r = w / h;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const tr = r < .8 ? .8 : r > 1.91 ? 1.91 : r;
  if (mode === 'pad' && tr !== r){ if (r < tr){ c.height = Math.min(h, 1440); c.width = Math.round(c.height * tr); } else { c.width = Math.min(w, 1440); c.height = Math.round(c.width / tr); }
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); const s = Math.min(c.width / w, c.height / h); ctx.drawImage(img, (c.width - w * s) / 2, (c.height - h * s) / 2, w * s, h * s); }
  else { let sw = w, sh = h; if (r < tr) sh = w / tr; else if (r > tr) sw = h * tr; const s = Math.min(1, 1440 / sw); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
    ctx.drawImage(img, (w - sw) / 2, (h - sh) / 2, sw, sh, 0, 0, c.width, c.height); }
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', .9));
  const p = `ig/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;
  check(await sb.storage.from('foto').upload(p, blob, {contentType:'image/jpeg'}));
  const {data: u} = await sb.storage.from('foto').createSignedUrl(p, 3600);
  return u.signedUrl;
}

async function storyDraw(bg){

  g.save(); g.beginPath(); g.rect(0, 0, W, ph); g.clip(); g.drawImage(img, (W - w) / 2, (ph - h) / 2, w, h); g.restore();
  const F = getComputedStyle(document.body).fontFamily || 'sans-serif';

  const price = Math.min(...(av.length ? av : m.variants).map(v => Number(v.sale_price ?? m.list_price ?? 0)));

    if (m.list_price && Number(m.list_price) > price){ const pw = g.measureText(eur(price).replace(',00', '')).width; g.font = `400 48px ${F}`; g.globalAlpha = .7; const o = eur(m.list_price).replace(',00', ''); g.fillText(o, 100 + pw, ph + 270); const ow = g.measureText(o).width; g.fillRect(100 + pw, ph + 252, ow, 4); g.globalAlpha = 1; } }

  if (m.kind === 'ordine'){ g.font = `700 38px ${F}`; const tw = g.measureText(x.order).width; g.fillStyle = '#f1e1d2'; g.fillRect(W - tw - 110, 80, tw + 60, 70); g.fillStyle = '#4c2f2a'; g.fillText(x.order, W - tw - 80, 128); }
}

// other sizes/colours of the same product still without a purchase cost (in stock or already sold)
async function siblingsNoCost(mid, exclude = []){
  const vs = check(await sb.from('variants').select('id,size,color,qty').eq('model_id', mid));
  const ids = vs.map(x => x.id).concat([0]);
  const [vc, ol, pl] = await Promise.all([sb.from('variant_costs').select('variant_id,purchase_price').in('variant_id', ids).then(check),
    sb.from('order_lines').select('variant_id,qty,orders!inner(status)').in('variant_id', ids).not('orders.status', 'in', '(annullato,bozza)').then(check),
    sb.from('purchase_lines').select('variant_id').in('variant_id', ids).then(check)]);
  const costed = new Set(vc.filter(x => x.purchase_price != null).map(x => x.variant_id)), bought = new Set(pl.map(x => x.variant_id));
  return vs.filter(x => !exclude.includes(x.id) && !costed.has(x.id) && !bought.has(x.id)).map(x => ({...x, sold: ol.filter(o => o.variant_id === x.id).reduce((a, o) => a + o.qty, 0)}))
    .filter(x => x.qty > 0 || x.sold > 0);
}
async function offerSameCost(mid, price, pid, exclude){
  if (!price || !pid) return;
  const L = await siblingsNoCost(mid, exclude);
  if (!L.length) return;
  const list = L.map(x => `• ${[x.size, x.color].filter(Boolean).join(' · ')} (${x.qty + x.sold} pz)`).join('\n');
  if (!confirm(`${t('same_cost_q').replace('{p}', eur(price))}\n\n${list}`)) return;
  for (const x of L) check(await sb.from('purchase_lines').insert({variant_id: x.id, qty: Math.max(1, x.qty + x.sold), unit_price: price, purchase_id: pid, add_to_stock: false}));
  toast(`✓ ${L.length} ${t('same_cost_done')}`);
}
// from the "pieces without cost" list: reuse the cost of another size of the same product
async function applySiblingCost(mid){
  const vs = check(await sb.from('variants').select('id').eq('model_id', mid)).map(x => x.id);
  const pl = check(await sb.from('purchase_lines').select('purchase_id,unit_price,variant_id,id').in('variant_id', vs.concat([0])).gt('unit_price', 0).order('id', {ascending:false}).limit(1));
  if (!pl.length){ toast(t('same_cost_none'), true); return; }
  await offerSameCost(mid, Number(pl[0].unit_price), pl[0].purchase_id, []);
  document.querySelectorAll('.modal-bg').forEach(x => x.remove()); route();
}

  ${window._noCost.map(v => `<div class="row" style="flex-wrap:nowrap;padding:10px 0;border-top:1px solid var(--line);cursor:pointer" onclick="this.closest('.modal-bg').remove();location.hash='#/articolo/${v.models.id}'">
    <div style="flex:1;min-width:0"><b>${esc(brandName(v.models.brand_id))} ${esc(v.models.name)}</b><div class="small muted">${esc([v.size, v.color].filter(Boolean).join(' · '))} · ${v.qty} pz</div></div><div class="right">${eur(v.sale_price)}<br><button class="small" onclick="event.stopPropagation();applySiblingCost(${v.models.id})">💶 ${t('same_cost_btn')}</button></div></div>`).join('')}
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="this.closest('.modal-bg').remove();location.hash='#/acquisti'">${t('purchases')} →</button><button class="primary" onclick="this.closest('.modal-bg').remove()">${t('close')}</button></div>`);
}
async function showMarginDetail(){
  const ml = check(await sb.from('v_line_margins').select('*').in('status', ['confermato','spedito']).order('order_id'));
  const sum = k => ml.reduce((a, r) => a + Number(r[k] || 0), 0);
  const m = modal(`<h2>${t('margins_delivery')}</h2><p class="small muted">${t('margins_hint')}</p>
  ${ml.map(r => `<div class="row" style="flex-wrap:nowrap;padding:10px 0;border-top:1px solid var(--line);cursor:pointer" onclick="this.closest('.modal-bg').remove();location.hash='#/ordine/${r.order_id}'">
    <div style="flex:1;min-width:0"><b>${esc(r.item)}</b><div class="small muted">${esc(r.order_no)} · ${esc(r.customer)}</div>
    <div class="small">${eur(r.gross)}${Number(r.discount_share) ? ` − ${eur(r.discount_share)} ${t('discount').toLowerCase()}` : ''} − ${r.landed_cost == null ? `<span style="color:var(--warn)">${t('cost_missing')}</span>` : `${eur(r.qty * Number(r.landed_cost))} ${t('cost').toLowerCase()}`}${Number(r.shipping_share) ? ` − ${eur(r.shipping_share)} ${t('shipments').toLowerCase()}` : ''}</div></div>
    <div class="right" style="flex:none"><b style="color:${Number(r.margin) >= 0 ? 'var(--good)' : 'var(--bad)'}">${eur(r.margin)}</b></div></div>`).join('') || `<div class="empty">${t('no_data')}</div>`}
  <div class="row spread" style="padding-top:10px;border-top:1px solid var(--line)"><b>${t('total')}</b><b style="font-size:20px">${eur(sum('margin'))}</b></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="this.closest('.modal-bg').remove();location.hash='#/report'">${t('reports')} →</button><button class="primary" onclick="this.closest('.modal-bg').remove()">${t('close')}</button></div>`);
}

// ====== Impostazioni ======
async function viewSettings(main){
  let users = '';
  if (can.admin()){
    const ps = check(await sb.from('profiles').select('*').order('created_at'));
    users = `<div class="card"><h3>${t('users')}</h3><p class="small muted">${t('users_hint')}</p><table>${ps.map(p => `<tr><td>${esc(p.full_name || '')}<div class="small muted">${esc(p.email || '')}</div></td><td><select onchange="setRole('${p.id}', this.value)" ${p.id === S.user.id ? 'disabled' : ''}><option value="">—</option>${opts('role').map(([k, l]) => `<option value="${k}" ${p.role === k ? 'selected' : ''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`;
  }
  const carriers = can.sales() ? `<div class="card"><div class="row spread"><h3>${t('carriers')}</h3><button onclick="editCarrier()">+ ${t('add')}</button></div><table>${S.carriers.map(c => `<tr><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.tracking_url_template || t('forgot_template'))}</div></td><td class="right"><button class="link" onclick="editCarrier(${c.id})">${t('edit')}</button></td></tr>`).join('')}</table></div>` : '';
  const cats = can.catalogWrite() ? `<div class="card"><div class="row spread"><h3>${t('category')} / ${t('brand')}</h3><div class="row"><button onclick="addCategory()">+ ${t('category')}</button><button onclick="addBrand()">+ ${t('brand')}</button></div></div><p class="small">${catOptions().map(c => esc(c[1])).join(' · ')}</p><p class="small muted">${S.brands.map(b => esc(b.name)).join(' · ')}</p></div>` : '';
  const backup = can.admin() ? `<div class="card"><h3>${t('backup')}</h3><p class="small muted">${t('backup_hint')}</p><div class="chips">${['models','variants','variant_costs','purchases','purchase_lines','purchase_costs','customers','customer_measurements','addresses','orders','order_lines','payments','shipments','expenses','stock_movements','activity_log'].map(x => `<button onclick="exportCsv('${x}')">${x}</button>`).join('')}</div></div>` : '';
  main.innerHTML = `<h1>${t('settings')}</h1><div class="card"><p>${esc(S.profile.full_name || '')} · ${esc(S.profile.email || '')} · <span class="pill">${esc(ev('role', S.profile.role))}</span></p><label>${t('language')}</label>${langSelect()}</div>${can.admin() ? `<div class="card"><h3>${t('data_start')}</h3><p class="small muted">${t('data_start_hint')}</p><input type="date" value="${esc(S.dataStart)}" onchange="setDataStart(this.value)" style="max-width:220px"></div>` : ''}${users}${carriers}${cats}${backup}`;
}
async function setDataStart(v){ if (!v) return; check(await sb.from('app_settings').upsert({k:'data_start', v, updated_at: new Date().toISOString()})); S.dataStart = v; toast(t('saved')); }
async function setRole(id, role){ check(await sb.from('profiles').update({role: role || null}).eq('id', id)); toast(t('saved')); }
function editCarrier(id){
  const c = id ? S.carriers.find(x => x.id === id) : {};
  form({title:t('carrier'), fields:[{name:'name', label:t('name'), required:true},{name:'tracking_url_template', label:t('tracking_template')},{name:'notes', label:t('notes')}], values:c,
    onSubmit: async v => { if (id) check(await sb.from('carriers').update(v).eq('id', id)); else check(await sb.from('carriers').insert(v)); await loadRefs(); route(); }});
}
function addCategory(){
  form({title:t('category'), fields:[{name:'name', label:t('name') + ' (IT)', required:true},{name:'name_en', label:t('name') + ' (EN)'},{name:'name_sq', label:t('name') + ' (SQ)'},{name:'parent_id', label:t('inside'), type:'select', options:S.categories.filter(c => !c.parent_id).map(c => [c.id, catName(c)])}],
    onSubmit: async v => { check(await sb.from('categories').insert(v)); await loadRefs(); route(); }});
}
function addBrand(){
  form({title:t('brand'), fields:[{name:'name', label:t('name'), required:true},{name:'country', label:t('country')},{name:'size_guide', label:t('size_guide'), type:'textarea'}],
    onSubmit: async v => { check(await sb.from('brands').insert(v)); await loadRefs(); route(); }});
}
async function exportCsv(table){
  const rows = check(await sb.from(table).select('*').limit(10000));
  if (!rows.length) return toast(t('no_data'));
  const cols = Object.keys(rows[0]);
  const cell = v => { if (v == null) return ''; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '\ufeff' + [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = `mv_${table}_${today()}.csv`; a.click();
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') renderLogin(); });
boot();
</script>
